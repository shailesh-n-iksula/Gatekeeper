name: Weekly full matrix

# Friday 22:00 UTC: the MENA weekend (Fri/Sat) is quietest for staging.
on:
  schedule:
    - cron: '0 22 * * 5'
  workflow_dispatch:

concurrency:
  group: staging-weekly
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      SUITE: weekly
      SHARDED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          browsers: chromium webkit firefox
          env-file: ${{ secrets.QA_ENV_FILE }}
      - run: npx playwright test --shard=${{ matrix.shard }}/8
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-${{ matrix.shard }}
          path: blob-report
          retention-days: 3

  report:
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          pattern: blob-*
          path: all-blob-reports
          merge-multiple: true
      - run: npx playwright merge-reports --reporter html,json ./all-blob-reports
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/results.json
      - run: npm run flaky
      - uses: actions/upload-artifact@v4
        with:
          name: weekly-report
          path: |
            playwright-report
            test-results/results.json
          retention-days: 60
